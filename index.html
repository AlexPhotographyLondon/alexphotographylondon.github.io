<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alex Photography</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

<header class="banner">
  <div class="banner-inner">
    <h1>Alex Photography</h1>
    <p>Capturing light, mood & moments</p>
  </div>
</header>

<main>
  <section class="hero">
    <img class="hero-image" src="assets/images/hero-photo.jpg" alt="">
  </section>

  <section id="gallery" class="section gallery">
    <h2>Gallery</h2>
    <div class="grid">
      <figure><img src="assets/images/gallery1.jpg" alt=""><figcaption>Photo 1</figcaption></figure>
      <figure><img src="assets/images/gallery2.jpg" alt=""><figcaption>Photo 2</figcaption></figure>
      <figure><img src="assets/images/gallery3.jpg" alt=""><figcaption>Photo 3</figcaption></figure>
    </div>
  </section>

  <section class="section about">
    <h2>About Me</h2>
    <p>I’m Alex — exploring light and quiet moments through photography.</p>
  </section>
</main>

<footer class="site-footer">
  <small>© <span id="year"></span> Alex Photography</small>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  // === SHRINKING BANNER ===
  const banner = document.querySelector('.banner');

  window.addEventListener("scroll", () => {
    let scrolled = window.scrollY;
    let newHeight = Math.max(45, 110 - scrolled * 0.3); 
    banner.style.height = newHeight + "px";
  });
</script>

</body>
</html>
