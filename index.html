<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alex Photography</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body>

<header class="banner">
  <!-- Logo -->
  <div class="logo-container">
    <img src="assets/images/Logo.svg" alt="Logo" class="logo">
  </div>

  <div class="banner-inner">
    <h1>Alex Photography</h1>
    <p>Capturing light, mood & moments</p>
  </div>

  <button class="menu-toggle" aria-label="Open Menu">&#9776;</button>

  <nav class="menu">
    <a href="index.html">Gallery</a>
    <a href="about.html">About Me</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main>
  <section id="gallery" class="section gallery">
    <h2>Gallery</h2>
    <div class="grid">

      <!-- Example image frame -->
      <div class="image-frame fade-in">
        <img class="zoomable" src="assets/images/Tree W.jpeg" alt="Tree and bench"
             data-location="Wandle Park, Croydon">
        <div class="location-label">Wandle Park, Croydon</div>
      </div>

      <!-- Repeat other images, make sure each has a .location-label div with same text as data-location -->
      
    </div>
  </section>
</main>

<footer class="site-footer">
  <small>© <span id="year"></span> Alex Photography</small>
</footer>

<!-- Lightbox Modal -->
<div id="image-modal" class="modal">
  <span class="modal-close">&times;</span>
  <img class="modal-content" id="modal-img">
</div>

<script src="assets/js/script.js"></script>
</body>
</html>
