<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Alex Photography</title>

  <style>
    /* ------------------ RESET & BASIC ------------------ */
    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: #e6f0f3; /* pale aqua background */
      color: #2f3e46; /* desaturated blue-grey text */
    }

    /* ------------------ FIXED BANNER ------------------ */
    .banner {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 50vh; /* default desktop height */
      border-top: 3px solid #8aa29e; /* muted teal accent */
      overflow: hidden;
      z-index: 999;
      transition: height 0.3s ease;
    }

    .banner.shrink {
      height: 20vh;
    }

    .banner-overlay {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #a7c5bd, #e6f0f3); /* soft blue-green gradient */
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.3s ease;
    }

    /* ------------------ GLASS TEXT ------------------ */
    .glass-text {
      background: rgba(255,255,255,0.25); /* translucent glass */
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 2rem 3rem;
      border-radius: 15px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      text-align: center;
      color: #2f3e46; /* text color for contrast */
      transition: all 0.3s ease;
    }

    .banner.shrink .glass-text {
      padding: 1rem 2rem;
    }

    .banner.shrink h1 {
      font-size: 1.5rem;
    }

    .banner.shrink .tag {
      font-size: 0.9rem;
    }

    /* ------------------ FADE-IN ------------------ */
    .fade-in {
      opacity: 0;
      animation: fadeIn 1.5s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* ------------------ MAIN CONTENT ------------------ */
    .site-main {
      padding-top: 50vh; /* content starts below banner */
      transition: padding-top 0.3s ease;
    }

    /* ------------------ SECTIONS ------------------ */
    .section {
      padding: 4rem 2rem;
    }

    h2 {
      margin-bottom: 1.5rem;
    }

    /* ------------------ GALLERY GRID ------------------ */
    .grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    }

    .grid img {
      width: 100%;
      display: block;
      border-radius: 8px;
    }

    /* ------------------ FOOTER ------------------ */
    .site-footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.9rem;
      color: #4a4a4a;
    }

    /* ------------------ MOBILE ------------------ */
    @media (max-width: 768px) {
      .banner {
        height: 30vh;
      }
      .banner.shrink {
        height: 15vh;
      }
      .glass-text {
        padding: 1rem 1.5rem;
      }
      .banner.shrink .glass-text {
        padding: 0.8rem 1.2rem;
      }
      .banner-content h1 {
        font-size: 1.5rem;
      }
      .banner-content p {
        font-size: 0.9rem;
      }
      .site-main {
        padding-top: 30vh;
      }
      .banner.shrink ~ .site-main {
        padding-top: 15vh;
      }
    }
  </style>
</head>
<body>

  <!-- Fixed Banner -->
  <header class="banner" role="banner" aria-label="Site banner">
    <div class="banner-overlay">
      <div class="banner-content fade-in">
        <div class="glass-text">
          <h1>Alex Photography</h1>
          <p class="tag">Capturing light, mood & moments</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Main content -->
  <main class="site-main">
    <section id="gallery" class="section">
      <h2>Gallery</h2>
      <div class="grid">
        <figure><img src="assets/images/Sunset and rain.jpg" alt=""><figcaption>Photo 1</figcaption></figure>
        <figure><img src="assets/images/gallery2.jpg" alt=""><figcaption>Photo 2</figcaption></figure>
        <figure><img src="assets/images/gallery3.jpg" alt=""><figcaption>Photo 3</figcaption></figure>
      </div>
    </section>

    <section id="about" class="section">
      <h2>About</h2>
      <p>I'm Alex — learning photography. This is a clean ambient portfolio.</p>
    </section>
  </main>

  <footer class="site-footer">
    <small>© <span id="year"></span> Alex Photography</small>
  </footer>

  <!-- JavaScript for dynamic shrinking banner -->
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const banner = document.querySelector('.banner');
    const main = document.querySelector('.site-main');

    // Set initial padding
    main.style.paddingTop = banner.offsetHeight + 'px';

    window.addEventListener('scroll', () => {
      if (window.scrollY > 50) {
        banner.classList.add('shrink');
        main.style.paddingTop = banner.offsetHeight + 'px';
      } else {
        banner.classList.remove('shrink');
        main.style.paddingTop = banner.offsetHeight + 'px';
      }
    });
  </script>

</body>
</html>
