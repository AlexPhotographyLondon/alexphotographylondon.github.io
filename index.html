<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alex Photography</title>

  <!-- Google fonts used earlier -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body>

<header class="banner">
  <div class="banner-inner">
    <h1>Alex Photography</h1>
    <p>Capturing light, mood & moments</p>
  </div>

  <button class="menu-toggle" aria-label="Open Menu">&#9776;</button>

  <nav class="menu" aria-hidden="true">
    <a href="index.html">Gallery</a>
    <a href="about.html">About Me</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main>
  <section id="gallery" class="section gallery">
    <h2>Gallery</h2>

    <div class="grid">

      <div class="image-frame fade-in">
        <img src="assets/images/Sunset and rain.jpg" alt="Sunset and Rain">
      </div>

      <div class="image-frame fade-in">
        <img src="assets/images/Ghost Building.jpg" alt="Ghost Building">
      </div>

      <div class="image-frame fade-in">
        <img src="assets/images/Nero.jpg" alt="Nero">
      </div>

      <div class="image-frame fade-in">
        <img src="assets/images/Unknown Building.jpg" alt="Unknown Building">
      </div>

      <div class="image-frame fade-in">
        <img src="assets/images/Duck Sunset.jpg" alt="Duck Sunset">
      </div>

      <div class="image-frame fade-in">
        <img src="assets/images/Shape.heic" alt="Shape">
      </div>

      <div class="image-frame fade-in">
        <img src="assets/images/Wandle Park.heic" alt="Wandle Park">
      </div>

      <div class="image-frame fade-in">
        <img src="assets/images/Light Bar.heic" alt="Light Bar">
      </div>

    </div>
  </section>
</main>

<footer class="site-footer">
  <small>© <span id="year"></span> Alex Photography</small>
</footer>

<!-- Modal / Lightbox -->
<div id="image-modal" class="modal" aria-hidden="true" role="dialog" aria-label="Image preview">
  <button class="modal-close" aria-label="Close">&times;</button>
  <img class="modal-content" id="modal-img" alt="">
</div>

<!-- Load site JS -->
<script src="assets/js/main.js"></script>
</body>
</html>
