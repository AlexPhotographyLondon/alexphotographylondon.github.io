<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Alex Photography</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

<header class="banner">
  <div class="banner-inner">
    <div class="glass-text">
      <h1>Alex Photography</h1>
      <p>Capturing light, mood & moments</p>
    </div>
  </div>
</header>

<main>
  <img class="hero-photo" src="assets/images/Sunset and rain.jpg" alt="Photo 1">

  <section class="section">
    <h2>Gallery</h2>
    <p>Your content here…</p>
  </section>
</main>

<script>
  // Smooth banner shrink
  window.addEventListener('scroll', () => {
    const banner = document.querySelector('.banner');
    const scrolled = window.scrollY;
    const newHeight = Math.max(80, 280 - scrolled * 0.4);
    banner.style.height = newHeight + "px";
  });
</script>

</body>
</html>
