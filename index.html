<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alex Photography</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

<header class="banner">
  <div class="banner-inner">
    <h1>Alex Photography</h1>
    <p>Capturing light, mood & moments</p>
  </div>
  <button class="menu-toggle" aria-label="Open Menu">&#9776;</button>
  <nav class="menu">
    <a href="#gallery">Gallery</a>
    <a href="#about">About Me</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<main>
  <section id="gallery" class="section gallery">
    <h2>Gallery</h2>
    <div class="grid">
      <div class="image-frame">
        <img src="assets/images/Sunset and rain.jpg" alt="Sunset And Rain">
        <figcaption>Sunset And Rain</figcaption>
      </div>
      <div class="image-frame">
        <img src="assets/images/Ghost Building.jpg" alt="Ghost Building">
        <figcaption>Ghost Building</figcaption>
      </div>
      <div class="image-frame">
        <img src="assets/images/Nero.jpg" alt="Nero">
        <figcaption>Photo 3</figcaption>
      </div>
    </div>
  </section>

  <section id="about" class="section about">
    <h2>About Me</h2>
    <p>I’m Alex — exploring light and quiet moments through photography.</p>
  </section>

  <section id="contact" class="section contact">
    <h2>Contact</h2>
    <p>You can reach me via email: <a href="mailto:alex@example.com">alex@example.com</a></p>
  </section>
</main>

<footer class="site-footer">
  <small>© <span id="year"></span> Alex Photography</small>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  // === SHRINKING BANNER ===
  const banner = document.querySelector('.banner');
  const bannerInner = document.querySelector('.banner-inner');
  const menuToggle = document.querySelector('.menu-toggle');
  const menu = document.querySelector('.menu');

  window.addEventListener("scroll", () => {
    let scrolled = window.scrollY;
    let newHeight = Math.max(60, 110 - scrolled * 0.3); // minimum height 60px
    banner.style.height = newHeight + "px";

    // optional: scale down text slightly
    let scale = Math.max(0.8, 1 - scrolled * 0.0015);
    bannerInner.style.transform = `scale(${scale})`;
  });

  // === MENU TOGGLE ===
  menuToggle.addEventListener("click", () => {
    menu.classList.toggle("open");
  });
</script>

</body>
</html>
