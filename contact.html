<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact - Alex Photography</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

<header class="banner">
  <!-- Logo on the left -->
  <div class="logo-container">
    <img src="assets/images/logo is.svg" alt="Logo" class="logo">
  </div>

  <div class="banner-inner">
    <h1>Alex Photography</h1>
    <p>Capturing light, mood & moments</p>
  </div>

  <button class="menu-toggle" aria-label="Open Menu">&#9776;</button>

  <nav class="menu">
    <a href="index.html">Gallery</a>
    <a href="about.html">About Me</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main>
  <section class="section contact">
    <h2>Contact</h2>
    <p>You can reach me via email: <a href="mailto:alex.nicolas.apple@icloud.com">alex.nicolas.apple@icloud.com</a></p>
  </section>
</main>

<footer class="site-footer">
  <small>© <span id="year"></span> Alex Photography</small>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  // SHRINKING BANNER
  const banner = document.querySelector('.banner');
  const bannerInner = document.querySelector('.banner-inner');
  const menuToggle = document.querySelector('.menu-toggle');
  const menu = document.querySelector('.menu');

  window.addEventListener("scroll", () => {
    let scrolled = window.scrollY;
    let newHeight = Math.max(60, 110 - scrolled * 0.3);
    banner.style.height = newHeight + "px";
    let scale = Math.max(0.8, 1 - scrolled * 0.0015);
    bannerInner.style.transform = `scale(${scale})`;
  });

  // MENU TOGGLE
  menuToggle.addEventListener("click", () => {
    menu.classList.toggle("open");
  });
</script>

</body>
</html>
