<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photography</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

    <!-- Fixed Banner -->
    <header class="banner">
        <img src="assets/images/banner.jpg.JPG" alt="Banner">
        <div class="banner-title">
            <h1>My Photography</h1>
        </div>
    </header>

    <!-- Main Content -->
    <main class="content">

        <section class="intro">
            <p>Welcome to my photography world — a growing collection of moments, textures, and stories captured through my lens.</p>
        </section>

        <section class="gallery">
            <img src="assets/images/gallery1.jpg" alt="Gallery Image">
            <img src="assets/images/gallery2.jpg" alt="Gallery Image">
            <img src="assets/images/gallery3.jpg" alt="Gallery Image">
        </section>

    </main>

</body>
</html>
