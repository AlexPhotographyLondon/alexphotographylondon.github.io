<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alex Photography</title>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<!-- Hero / Banner -->
<header class="hero">
    <img src="assets/images/banner.jpg.JPG" alt="Banner" class="hero-img">
    <div class="hero-text">
        <h1>Alex Photography</h1>
        <p>Capturing light, mood, and emotion</p>
        <a class="cta" href="#gallery">View Gallery</a>
    </div>
    <nav class="menu">
        <a href="#gallery">Gallery</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<!-- Main content -->
<main>
<section id="gallery" class="section">
    <h2>Gallery</h2>
    <div class="gallery">
        <figure class="photo">
            <img src="assets/images/gallery1.jpg" alt="Gallery 1">
            <figcaption>Gallery 1</figcaption>
        </figure>
        <figure class="photo">
            <img src="assets/images/gallery2.jpg" alt="Gallery 2">
            <figcaption>Gallery 2</figcaption>
        </figure>
        <figure class="photo">
            <img src="assets/images/gallery3.jpg" alt="Gallery 3">
            <figcaption>Gallery 3</figcaption>
        </figure>
        <!-- Add more gallery images here -->
    </div>
</section>

<section id="about" class="section">
    <h2>About</h2>
    <p>I'm Alex — learning photography. This site showcases my work with a clean, ambient style.</p>
</section>

<section id="contact" class="section">
    <h2>Contact</h2>
    <p>Email: <a href="mailto:alex@example.com">alex@example.com</a></p>
    <p>Instagram/Twitter: <em>@yourhandle</em></p>
</section>
</main>

<!-- Footer -->
<footer>
    <p>© <span id="year"></span> Alex Photography</p>
</footer>

<script src="assets/js/script.js"></script>
</body>
</html>
