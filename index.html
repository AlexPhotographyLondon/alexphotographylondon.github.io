<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alex Photography</title>

  <link rel="stylesheet" href="assets/css/styles.css" />

  <!-- Lightbox styles (inline) -->
  <style>
    .modal {
      display: none;
      position: fixed;
      z-index: 50;
      padding-top: 60px;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      margin: auto;
      display: block;
      max-width: 90%;
      max-height: 90%;
      border: 4px solid #fff;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      border-radius: 4px;
      transition: transform 0.3s ease;
    }
    .modal-content:hover { transform: scale(1.02); }
    .modal-close {
      position: absolute;
      top: 20px;
      right: 35px;
      color: #fff;
      font-size: 40px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header class="banner">

  <!-- NEW LOGO -->
  <div class="logo-container">
    <img src="assets/images/logo.png" alt="Logo" class="logo">
  </div>

  <div class="banner-inner">
    <h1>Alex Photography</h1>
    <p>Capturing light, mood & moments</p>
  </div>

  <button class="menu-toggle" aria-label="Open Menu">&#9776;</button>

  <nav class="menu">
    <a href="index.html">Gallery</a>
    <a href="about.html">About Me</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main>
  <section id="gallery" class="section gallery">
    <h2>Gallery</h2>

    <div class="grid">

      <div class="image-frame fade-in">
        <img class="zoomable" src="assets/images/Sunset and rain.jpg" alt="Sunset and Rain">
      </div>

      <div class="image-frame fade-in">
        <img class="zoomable" src="assets/images/Ghost Building.jpg" alt="Ghost Building">
      </div>

      <div class="image-frame fade-in">
        <img class="zoomable" src="assets/images/Nero.jpg" alt="Nero">
      </div>

      <div class="image-frame fade-in">
        <img class="zoomable" src="assets/images/Unknown Building.jpg" alt="Unknown Building">
      </div>

      <div class="image-frame fade-in">
        <img class="zoomable" src="assets/images/Duck Sunset.jpg" alt="Duck Sunset">
      </div>

      <div class="image-frame fade-in">
        <img class="zoomable" src="assets/images/Shape.heic" alt="Shape">
      </div>

      <div class="image-frame fade-in">
        <img class="zoomable" src="assets/images/Wandle Park.heic" alt="Wandle Park">
      </div>

      <div class="image-frame fade-in">
        <img class="zoomable" src="assets/images/Light Bar.heic" alt="Light Bar">
      </div>

    </div>
  </section>
</main>

<footer class="site-footer">
  <small>© <span id="year"></span> Alex Photography</small>
</footer>

<!-- Lightbox Modal -->
<div id="image-modal" class="modal">
  <span class="modal-close">&times;</span>
  <img class="modal-content" id="modal-img">
</div>

<script src="assets/js/script.js"></script>

</body>
</html>
