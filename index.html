<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alex Photography</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <h1 class="site-title">Alex Photography</h1>
      <p class="site-tagline">Capturing light, mood & moments</p>
    </div>
  </header>

  <main class="site-main">
    <section class="hero">
      <img class="hero-image" src="assets/images/hero-photo.jpg" alt="Hero photo">
    </section>

    <section id="gallery" class="section gallery">
      <h2>Gallery</h2>
      <div class="grid">
        <figure><img src="assets/images/gallery1.jpg" alt=""><figcaption>Photo 1</figcaption></figure>
        <figure><img src="assets/images/gallery2.jpg" alt=""><figcaption>Photo 2</figcaption></figure>
        <figure><img src="assets/images/gallery3.jpg" alt=""><figcaption>Photo 3</figcaption></figure>
        <!-- Add more figures as needed -->
      </div>
    </section>

    <section id="about" class="section about">
      <h2>About Me</h2>
      <p>Hi, I’m Alex—a photographer exploring light, emotion, and the quiet moments.</p>
    </section>
  </main>

  <footer class="site-footer">
    <small>© <span id="year"></span> Alex Photography</small>
  </footer>

  <script>
    // Set current year
    document.getElementById('year').textContent = new Date().getFullYear();

    // Shrink header on scroll
    const header = document.querySelector('.site-header');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 100) {
        header.classList.add('shrink');
      } else {
        header.classList.remove('shrink');
      }
    });
  </script>

</body>
</html>
